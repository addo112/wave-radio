<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wave Radio - DJ Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6C5CE7;
            --secondary: #00CEC9;
            --accent: #FD79A8;
            --dark: #0a0a0f;
            --dark-surface: #12121a;
            --dark-card: #1a1a2e;
            --text-main: #f8f8f9;
            --text-muted: #a0a0b0;
            --glass-bg: rgba(26, 26, 46, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --danger: #e74c3c;
            --success: #2ecc71;
            --warning: #f1c40f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Typography & Utilities */
        h1, h2, h3, h4 { margin-bottom: 0.5rem; font-weight: 700; }
        p { color: var(--text-muted); margin-bottom: 1rem; }
        .text-gradient {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        /* Form elements */
        input[type="text"], input[type="password"], select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--text-main);
            font-family: inherit;
            margin-bottom: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            border-color: var(--primary);
        }
        
        button {
            cursor: pointer;
            font-family: inherit;
            border: none;
            outline: none;
            transition: all 0.3s;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 12px 24px;
        }
        
        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* Glass Cards */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* Login Gate */
        #login-gate {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, var(--dark-surface) 0%, var(--dark) 100%);
            z-index: 1000;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card h2 {
            margin-bottom: 1.5rem;
            font-size: 2rem;
        }
        .login-card .hint {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 1rem;
        }

        /* Dashboard Layout */
        #dashboard {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            border-radius: 12px;
        }
        .header-logo {
            font-size: 1.5rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--danger);
            box-shadow: 0 0 8px var(--danger);
        }
        .dot.connected {
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
        }

        /* Main Dashboard Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
            flex: 1;
        }
        
        @media (max-width: 900px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .main-col {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .side-col {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Main Controls Panel */
        .main-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
            min-height: 400px;
        }

        .mic-selection {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 30px;
        }

        .level-meter-container {
            width: 100%;
            max-width: 400px;
            height: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 40px;
            border: 1px solid var(--glass-border);
        }

        #level-meter-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--success) 0%, var(--warning) 70%, var(--danger) 100%);
            transition: width 0.1s ease-out;
            transform-origin: left;
        }

        /* GO LIVE BUTTON */
        .go-live-wrapper {
            position: relative;
            margin-bottom: 30px;
        }

        #go-live-btn {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            font-size: 1.2rem;
            font-weight: 800;
            border: 4px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all 0.3s;
        }
        
        #go-live-btn:hover {
            transform: scale(1.05);
            border-color: rgba(255,255,255,0.3);
        }

        #go-live-btn.live {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            animation: pulse-live 2s infinite;
        }

        @keyframes pulse-live {
            0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(231, 76, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
        }

        .monitor-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        /* Broadcast Info */
        .info-panel h3, .settings-panel h3, .server-panel h3 {
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }
        .stat-box {
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--secondary);
            margin-top: 5px;
        }

        /* Toggle Switches */
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255,255,255,0.1);
            transition: .4s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: var(--primary);
        }
        input:checked + .slider:before {
            transform: translateX(26px);
        }

        /* Server log */
        .log-container {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 10px;
            height: 150px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
            margin-top: 15px;
        }
        .log-msg { margin-bottom: 4px; }
        .log-msg.info { color: var(--text-main); }
        .log-msg.success { color: var(--success); }
        .log-msg.error { color: var(--danger); }
        .log-msg.warning { color: var(--warning); }
        .log-time { color: var(--text-muted); margin-right: 8px; }

    </style>
</head>
<body>

    <!-- Login Gate -->
    <div id="login-gate" class="gate-container">
        <div class="login-card glass-card">
            <h2 class="text-gradient">Wave Radio DJ</h2>
            <p>Login to start your broadcast</p>
            <form id="login-form">
                <input type="text" id="login-name" placeholder="DJ Name" required autocomplete="off">
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Enter Dashboard</button>
            </form>
            <p class="hint">Use the DJ password set on your relay server.</p>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" style="display: none;">
        <!-- Header -->
        <header class="glass-card">
            <div class="header-logo text-gradient">
                <i class="fas fa-wave-square"></i> Wave Radio
            </div>
            <div class="header-controls">
                <div class="status-indicator">
                    <span class="dot" id="connection-dot"></span>
                    <span id="connection-status-text">Disconnected</span>
                </div>
                <button class="btn" id="btn-logout"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </header>

        <div class="dashboard-grid">
            <div class="main-col">
                <!-- Main Controls Panel -->
                <div class="main-controls glass-card">
                    <div class="mic-selection">
                        <select id="mic-select">
                            <option value="">Loading microphones...</option>
                        </select>
                        <button class="btn" id="btn-refresh-mics" title="Refresh Mics"><i class="fas fa-sync"></i></button>
                    </div>

                    <div class="level-meter-container">
                        <div id="level-meter-fill"></div>
                    </div>

                    <div class="go-live-wrapper">
                        <button id="go-live-btn">
                            <i class="fas fa-microphone-alt"></i>
                            <span id="go-live-text">GO LIVE</span>
                        </button>
                    </div>

                    <label class="monitor-toggle">
                        <input type="checkbox" id="toggle-monitor">
                        <span>Monitor Audio (Hear yourself)</span>
                    </label>
                </div>

                <!-- Broadcast Info Panel -->
                <div class="info-panel glass-card">
                    <h3><i class="fas fa-info-circle"></i> Broadcast Info</h3>
                    <input type="text" id="show-title-input" placeholder="Enter Show Title (Max 100 chars)" maxlength="100">
                    <div class="stat-grid">
                        <div class="stat-box">
                            <div>Duration</div>
                            <div class="stat-value" id="broadcast-timer">00:00:00</div>
                        </div>
                        <div class="stat-box">
                            <div>Listeners</div>
                            <div class="stat-value" id="dj-listener-count">0</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="side-col">
                <!-- Audio Settings Panel -->
                <div class="settings-panel glass-card">
                    <h3><i class="fas fa-sliders-h"></i> Audio Settings</h3>
                    <label style="display: block; margin-bottom: 8px; color: var(--text-muted);">Audio Quality</label>
                    <select id="audio-quality">
                        <option value="32000">Low (32kbps)</option>
                        <option value="64000">Medium (64kbps)</option>
                        <option value="128000" selected>High (128kbps)</option>
                        <option value="256000">Ultra (256kbps)</option>
                    </select>

                    <div class="toggle-row">
                        <span>Echo Cancellation</span>
                        <label class="switch">
                            <input type="checkbox" id="toggle-echo" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="toggle-row">
                        <span>Noise Suppression</span>
                        <label class="switch">
                            <input type="checkbox" id="toggle-noise" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="toggle-row">
                        <span>Auto Gain Control</span>
                        <label class="switch">
                            <input type="checkbox" id="toggle-agc" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <!-- Server Connection Panel -->
                <div class="server-panel glass-card">
                    <h3><i class="fas fa-server"></i> Server</h3>
                    <input type="text" id="server-url" value="wss://wave-radio-relay.onrender.com/ws" placeholder="Relay Server URL">
                    <button class="btn btn-primary" id="btn-connect" style="width: 100%;">Connect to Server</button>
                    
                    <div class="log-container" id="status-log">
                        <!-- Logs go here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <style>
        .dot.connecting { background: var(--warning) !important; box-shadow: 0 0 8px var(--warning); animation: dotBlink 1s infinite; }
        @keyframes dotBlink { 50% { opacity: .3; } }
        #btn-connect.is-connected { background: rgba(231, 76, 60, 0.85); }
        #btn-connect:disabled { opacity: .6; cursor: wait; }
    </style>
    <script>
        /** Default public relay server (Render.com). Change this if you deploy elsewhere. */
        const DEFAULT_RELAY_WS = 'wss://wave-radio-relay.onrender.com/ws';
        const WAKE_TIMEOUT_MS = 75000; // Render free tier can take ~50s to wake up

        /**
         * Normalises whatever the user types into a valid WebSocket URL:
         *  - adds a scheme if missing, converts http(s) → ws(s)
         *  - forces wss:// when the page is served over https (browsers block ws:// there)
         *  - appends the /ws path if no path was given
         */
        function normalizeRelayUrl(input) {
            let raw = (input || '').trim();
            if (!raw) return DEFAULT_RELAY_WS;
            if (!/^[a-z]+:\/\//i.test(raw)) raw = 'wss://' + raw;
            raw = raw.replace(/^http:\/\//i, 'ws://').replace(/^https:\/\//i, 'wss://');

            let url;
            try { url = new URL(raw); } catch { return DEFAULT_RELAY_WS; }

            const isLocal = ['localhost', '127.0.0.1'].includes(url.hostname);
            if (location.protocol === 'https:' && url.protocol === 'ws:' && !isLocal) url.protocol = 'wss:';
            if (url.pathname === '/' || url.pathname === '') url.pathname = '/ws';
            return url.toString().replace(/\/$/, '');
        }

        /** ws(s)://host/ws → http(s)://host  (used to wake the server and read /status) */
        function relayHttpBase(wsUrl) {
            const u = new URL(wsUrl);
            u.protocol = u.protocol === 'wss:' ? 'https:' : 'http:';
            u.pathname = '';
            return u.toString().replace(/\/$/, '');
        }

        /** Picks the saved URL unless it is a localhost URL saved while on a public site. */
        function initialRelayUrl() {
            const saved = localStorage.getItem('relay-ws-url');
            const onPublicSite = !['localhost', '127.0.0.1', ''].includes(location.hostname);
            if (saved && !(onPublicSite && /localhost|127\.0\.0\.1/.test(saved))) return normalizeRelayUrl(saved);
            return DEFAULT_RELAY_WS;
        }

        class DJBroadcaster {
            constructor() {
                this.ws = null;
                this.mediaStream = null;
                this.mediaRecorder = null;

                this.audioContext = null;
                this.analyser = null;
                this.source = null;
                this.monitorNode = null;

                this.isLive = false;
                this.isAuthenticated = false;
                this.manualDisconnect = false;
                this.resumeAfterReconnect = false;
                this.reconnectAttempts = 0;
                this.reconnectTimer = null;
                this.broadcastStartTime = null;
                this.timerInterval = null;
                this.animationFrameId = null;
                this.initialized = false;

                this.serverUrl = DEFAULT_RELAY_WS;
                this.djName = '';
                this.authToken = '';

                this.els = {
                    micSelect: document.getElementById('mic-select'),
                    refreshMicsBtn: document.getElementById('btn-refresh-mics'),
                    levelMeter: document.getElementById('level-meter-fill'),
                    goLiveBtn: document.getElementById('go-live-btn'),
                    goLiveText: document.getElementById('go-live-text'),
                    monitorToggle: document.getElementById('toggle-monitor'),
                    showTitle: document.getElementById('show-title-input'),
                    timer: document.getElementById('broadcast-timer'),
                    listenerCount: document.getElementById('dj-listener-count'),
                    quality: document.getElementById('audio-quality'),
                    toggleEcho: document.getElementById('toggle-echo'),
                    toggleNoise: document.getElementById('toggle-noise'),
                    toggleAgc: document.getElementById('toggle-agc'),
                    serverUrl: document.getElementById('server-url'),
                    btnConnect: document.getElementById('btn-connect'),
                    statusLog: document.getElementById('status-log'),
                    connDot: document.getElementById('connection-dot'),
                    connText: document.getElementById('connection-status-text')
                };
            }

            async init(djName, token) {
                this.djName = djName;
                this.authToken = token;

                if (!this.initialized) {
                    this.setupEventListeners();
                    this.initialized = true;
                }
                this.log('Dashboard initialized.', 'info');

                this.serverUrl = initialRelayUrl();
                this.els.serverUrl.value = this.serverUrl;

                // Don't block the connection on the microphone permission prompt
                this.enumerateDevices();
                this.connectToServer();
            }

            setupEventListeners() {
                this.els.refreshMicsBtn.addEventListener('click', () => this.enumerateDevices());

                this.els.btnConnect.addEventListener('click', () => {
                    if (this.ws && this.ws.readyState === WebSocket.OPEN && this.isAuthenticated) {
                        this.disconnect();
                        return;
                    }
                    this.serverUrl = normalizeRelayUrl(this.els.serverUrl.value);
                    this.els.serverUrl.value = this.serverUrl;
                    localStorage.setItem('relay-ws-url', this.serverUrl);
                    this.reconnectAttempts = 0;
                    this.connectToServer();
                });

                this.els.serverUrl.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') this.els.btnConnect.click();
                });

                this.els.goLiveBtn.addEventListener('click', () => {
                    if (this.isLive) {
                        this.resumeAfterReconnect = false;
                        this.stopBroadcasting();
                    } else {
                        this.startBroadcasting();
                    }
                });

                this.els.monitorToggle.addEventListener('change', (e) => this.toggleMonitor(e.target.checked));

                this.els.showTitle.addEventListener('change', () => {
                    if (this.isLive) this.send({ type: 'metadata', showTitle: this.els.showTitle.value });
                });

                window.addEventListener('beforeunload', (e) => {
                    if (this.isLive) {
                        e.preventDefault();
                        e.returnValue = '';
                    }
                });
                window.addEventListener('pagehide', () => {
                    if (this.isLive) this.stopBroadcasting();
                });

                // Reconnect quickly when the network comes back
                window.addEventListener('online', () => {
                    if (!this.manualDisconnect && (!this.ws || this.ws.readyState > WebSocket.OPEN)) {
                        this.log('Network is back — reconnecting...', 'info');
                        this.connectToServer();
                    }
                });
            }

            async enumerateDevices() {
                try {
                    // Ask permission once so device labels are visible, then release the mic
                    const tmp = await navigator.mediaDevices.getUserMedia({ audio: true });
                    tmp.getTracks().forEach(t => t.stop());

                    const devices = await navigator.mediaDevices.enumerateDevices();
                    const audioInputs = devices.filter(d => d.kind === 'audioinput');

                    const previous = this.els.micSelect.value;
                    this.els.micSelect.innerHTML = '';
                    if (audioInputs.length === 0) {
                        this.els.micSelect.innerHTML = '<option value="">No microphones found</option>';
                        this.log('No microphones found.', 'warning');
                        return;
                    }
                    audioInputs.forEach((device, i) => {
                        const option = document.createElement('option');
                        option.value = device.deviceId;
                        option.text = device.label || `Microphone ${i + 1}`;
                        this.els.micSelect.appendChild(option);
                    });
                    if (previous && [...this.els.micSelect.options].some(o => o.value === previous)) {
                        this.els.micSelect.value = previous;
                    }
                    this.log(`Found ${audioInputs.length} microphone(s).`, 'info');
                } catch (err) {
                    this.els.micSelect.innerHTML = '<option value="">Microphone access blocked</option>';
                    this.log('Microphone access denied: allow mic permission in your browser (padlock icon in the address bar).', 'error');
                }
            }

            setStatus(state, text) {
                this.els.connDot.classList.remove('connected', 'connecting');
                if (state === 'connected') this.els.connDot.classList.add('connected');
                if (state === 'connecting') this.els.connDot.classList.add('connecting');
                this.els.connText.textContent = text;

                const btn = this.els.btnConnect;
                btn.disabled = state === 'connecting';
                btn.classList.toggle('is-connected', state === 'connected');
                btn.textContent = state === 'connected' ? 'Disconnect'
                                : state === 'connecting' ? 'Connecting...'
                                : 'Connect to Server';
            }

            /** Wakes a sleeping server (Render free tier) by hitting /health before opening the socket. */
            async wakeServer() {
                const base = relayHttpBase(this.serverUrl);
                const controller = new AbortController();
                const slowNotice = setTimeout(() => {
                    this.log('Server is waking up from sleep (free hosting) — this can take up to a minute...', 'warning');
                    this.setStatus('connecting', 'Waking server...');
                }, 3000);
                const abort = setTimeout(() => controller.abort(), WAKE_TIMEOUT_MS);
                try {
                    const res = await fetch(`${base}/health`, { cache: 'no-store', signal: controller.signal });
                    return res.ok;
                } catch (err) {
                    return false;
                } finally {
                    clearTimeout(slowNotice);
                    clearTimeout(abort);
                }
            }

            async connectToServer() {
                clearTimeout(this.reconnectTimer);
                this.manualDisconnect = false;
                this.isAuthenticated = false;

                if (this.ws) {
                    const old = this.ws;
                    this.ws = null;
                    old.onopen = old.onmessage = old.onclose = old.onerror = null;
                    try { old.close(); } catch (_) {}
                }

                if (location.protocol === 'https:' && this.serverUrl.startsWith('ws://') && !/localhost|127\.0\.0\.1/.test(this.serverUrl)) {
                    this.serverUrl = this.serverUrl.replace(/^ws:/, 'wss:');
                    this.els.serverUrl.value = this.serverUrl;
                }
                if (location.protocol === 'https:' && this.serverUrl.startsWith('ws://')) {
                    this.log('This page is on HTTPS, so the browser blocks insecure ws:// connections. Use your deployed wss:// relay URL, or open dj.html locally for localhost testing.', 'error');
                    this.setStatus('disconnected', 'Disconnected');
                    return;
                }

                this.setStatus('connecting', 'Connecting...');
                this.log(`Connecting to ${this.serverUrl} ...`, 'info');

                const awake = await this.wakeServer();
                if (this.manualDisconnect) return;
                if (!awake) {
                    this.log(`Relay server is not reachable at ${relayHttpBase(this.serverUrl)}. Check the URL and that the server is deployed.`, 'error');
                    this.setStatus('disconnected', 'Server unreachable');
                    this.scheduleReconnect();
                    return;
                }

                let ws;
                try {
                    ws = new WebSocket(this.serverUrl);
                } catch (err) {
                    this.log('Invalid server URL: ' + err.message, 'error');
                    this.setStatus('disconnected', 'Disconnected');
                    return;
                }
                ws.binaryType = 'arraybuffer';
                this.ws = ws;

                const openTimeout = setTimeout(() => {
                    if (ws.readyState === WebSocket.CONNECTING) {
                        this.log('Connection timed out.', 'error');
                        ws.close();
                    }
                }, 15000);

                ws.onopen = () => {
                    clearTimeout(openTimeout);
                    if (ws !== this.ws) return;
                    this.setStatus('connecting', 'Authenticating...');
                    this.log('Socket open — authenticating...', 'info');
                    ws.send(JSON.stringify({ type: 'auth', token: this.authToken, djName: this.djName }));
                };

                ws.onmessage = (event) => {
                    if (ws !== this.ws || typeof event.data !== 'string') return;
                    try {
                        this.handleServerMessage(JSON.parse(event.data));
                    } catch (e) {
                        console.error('Bad server message', e);
                    }
                };

                ws.onerror = () => {
                    if (ws !== this.ws) return;
                    this.log('WebSocket error (server rejected or network blocked the connection).', 'error');
                };

                ws.onclose = (event) => {
                    clearTimeout(openTimeout);
                    if (ws !== this.ws) return;
                    const wasAuthenticated = this.isAuthenticated;
                    this.isAuthenticated = false;
                    this.setStatus('disconnected', 'Disconnected');

                    if (this.isLive) {
                        this.resumeAfterReconnect = true;
                        this.stopBroadcasting(true);
                        this.log('Connection lost while live — will resume broadcast after reconnecting.', 'error');
                    }

                    if (event.code === 4003) {
                        this.log('Wrong DJ password. Log out and log in with the correct password.', 'error');
                        return; // don't retry with a bad password
                    }
                    if (this.manualDisconnect) {
                        this.log('Disconnected.', 'info');
                        return;
                    }
                    this.log(`Disconnected from server${event.code ? ` (code ${event.code})` : ''}.`, 'warning');
                    if (wasAuthenticated) this.reconnectAttempts = 0;
                    this.scheduleReconnect();
                };
            }

            scheduleReconnect() {
                if (this.manualDisconnect) return;
                this.reconnectAttempts++;
                if (this.reconnectAttempts > 10) {
                    this.log('Giving up after 10 attempts. Click "Connect to Server" to retry.', 'error');
                    return;
                }
                const delay = Math.min(30000, 2000 * Math.pow(1.6, this.reconnectAttempts - 1));
                this.log(`Retrying in ${Math.round(delay / 1000)}s (attempt ${this.reconnectAttempts}/10)...`, 'info');
                this.reconnectTimer = setTimeout(() => this.connectToServer(), delay);
            }

            disconnect() {
                this.manualDisconnect = true;
                this.resumeAfterReconnect = false;
                clearTimeout(this.reconnectTimer);
                if (this.isLive) this.stopBroadcasting();
                if (this.ws) this.ws.close(1000, 'DJ disconnected');
            }

            send(obj) {
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    this.ws.send(JSON.stringify(obj));
                    return true;
                }
                return false;
            }

            handleServerMessage(msg) {
                switch (msg.type) {
                    case 'auth_ok':
                        this.isAuthenticated = true;
                        this.reconnectAttempts = 0;
                        this.setStatus('connected', 'Connected');
                        this.log('Connected & authenticated. You can GO LIVE now.', 'success');
                        if (typeof msg.listeners === 'number') this.els.listenerCount.textContent = msg.listeners;
                        if (this.resumeAfterReconnect) {
                            this.resumeAfterReconnect = false;
                            this.log('Resuming broadcast...', 'info');
                            this.startBroadcasting();
                        }
                        break;
                    case 'auth_fail':
                        this.log('Authentication failed: ' + (msg.message || 'invalid password'), 'error');
                        break;
                    case 'live_ok':
                        this.log('Server confirmed: you are ON AIR.', 'success');
                        break;
                    case 'listener_count':
                        this.els.listenerCount.textContent = msg.count || 0;
                        break;
                    case 'error':
                        this.log('Server: ' + msg.message, 'error');
                        break;
                }
            }

            async startBroadcasting() {
                if (!this.ws || this.ws.readyState !== WebSocket.OPEN || !this.isAuthenticated) {
                    this.log('Cannot go live: not connected to the relay server yet.', 'error');
                    alert('Please wait until the status shows "Connected" before going live.');
                    return;
                }

                try {
                    const deviceId = this.els.micSelect.value;
                    this.mediaStream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            deviceId: deviceId ? { exact: deviceId } : undefined,
                            echoCancellation: this.els.toggleEcho.checked,
                            noiseSuppression: this.els.toggleNoise.checked,
                            autoGainControl: this.els.toggleAgc.checked,
                            channelCount: 2,
                            sampleRate: 48000
                        }
                    });

                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    if (this.audioContext.state === 'suspended') await this.audioContext.resume();
                    this.source = this.audioContext.createMediaStreamSource(this.mediaStream);

                    this.analyser = this.audioContext.createAnalyser();
                    this.analyser.fftSize = 256;
                    this.source.connect(this.analyser);

                    this.monitorNode = this.audioContext.createGain();
                    this.monitorNode.gain.value = 1.0;
                    this.source.connect(this.monitorNode);
                    if (this.els.monitorToggle.checked) this.monitorNode.connect(this.audioContext.destination);

                    const audioBps = parseInt(this.els.quality.value, 10);
                    const options = { mimeType: 'audio/webm;codecs=opus', audioBitsPerSecond: audioBps };
                    if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                        this.log('Your browser cannot encode WebM/Opus. Please use Chrome, Edge or Firefox to broadcast.', 'error');
                        this.cleanupMedia();
                        return;
                    }

                    // Tell the server first so it treats the very first chunk as the stream header
                    this.send({ type: 'start', showTitle: this.els.showTitle.value || 'Live DJ Set', djName: this.djName });

                    this.mediaRecorder = new MediaRecorder(this.mediaStream, options);
                    this.mediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0 && this.ws && this.ws.readyState === WebSocket.OPEN) {
                            if (this.ws.bufferedAmount > 2 * 1024 * 1024) {
                                this.log('Upload is slower than the audio bitrate — lower the Audio Quality.', 'warning');
                            }
                            this.ws.send(e.data);
                        }
                    };
                    this.mediaRecorder.onerror = (e) => this.log('Recorder error: ' + (e.error?.message || 'unknown'), 'error');
                    this.mediaRecorder.start(250);

                    this.isLive = true;
                    this.broadcastStartTime = new Date();
                    this.els.goLiveBtn.classList.add('live');
                    this.els.goLiveText.textContent = 'STOP';
                    this.setSettingsDisabled(true);

                    this.updateLevelMeter();
                    clearInterval(this.timerInterval);
                    this.timerInterval = setInterval(() => this.updateTimer(), 1000);
                    this.updateTimer();

                    this.log('BROADCAST STARTED — you are live to the world!', 'success');
                } catch (err) {
                    this.log('Failed to start broadcast: ' + err.message, 'error');
                    this.cleanupMedia();
                }
            }

            cleanupMedia() {
                if (this.mediaRecorder && this.mediaRecorder.state !== 'inactive') {
                    try { this.mediaRecorder.stop(); } catch (_) {}
                }
                this.mediaRecorder = null;
                if (this.mediaStream) this.mediaStream.getTracks().forEach(t => t.stop());
                this.mediaStream = null;
                if (this.audioContext && this.audioContext.state !== 'closed') this.audioContext.close();
                this.audioContext = null;
                this.analyser = null;
                this.monitorNode = null;
            }

            stopBroadcasting(silent = false) {
                if (!this.isLive) return;

                this.cleanupMedia();
                this.send({ type: 'stop' });

                this.isLive = false;
                clearInterval(this.timerInterval);
                cancelAnimationFrame(this.animationFrameId);
                this.els.levelMeter.style.width = '0%';

                this.els.goLiveBtn.classList.remove('live');
                this.els.goLiveText.textContent = 'GO LIVE';
                this.setSettingsDisabled(false);

                if (!silent) this.log('Broadcast stopped.', 'warning');
            }

            setSettingsDisabled(disabled) {
                ['micSelect', 'quality', 'toggleEcho', 'toggleNoise', 'toggleAgc'].forEach(k => this.els[k].disabled = disabled);
            }

            updateLevelMeter() {
                if (!this.isLive || !this.analyser) return;
                const data = new Uint8Array(this.analyser.frequencyBinCount);
                this.analyser.getByteFrequencyData(data);
                let sum = 0;
                for (let i = 0; i < data.length; i++) sum += data[i];
                const width = Math.min(100, (sum / data.length / 255) * 150);
                this.els.levelMeter.style.width = `${width}%`;
                this.animationFrameId = requestAnimationFrame(() => this.updateLevelMeter());
            }

            updateTimer() {
                const diff = Math.floor((Date.now() - this.broadcastStartTime) / 1000);
                const h = String(Math.floor(diff / 3600)).padStart(2, '0');
                const m = String(Math.floor((diff % 3600) / 60)).padStart(2, '0');
                const s = String(diff % 60).padStart(2, '0');
                this.els.timer.textContent = `${h}:${m}:${s}`;
            }

            toggleMonitor(enabled) {
                if (!this.audioContext || !this.monitorNode) return;
                try {
                    if (enabled) this.monitorNode.connect(this.audioContext.destination);
                    else this.monitorNode.disconnect();
                } catch (_) {}
            }

            log(message, type = 'info') {
                const time = new Date().toTimeString().split(' ')[0];
                const div = document.createElement('div');
                div.className = `log-msg ${type}`;
                const t = document.createElement('span');
                t.className = 'log-time';
                t.textContent = `[${time}]`;
                div.appendChild(t);
                div.appendChild(document.createTextNode(' ' + message));
                this.els.statusLog.appendChild(div);
                while (this.els.statusLog.children.length > 200) this.els.statusLog.firstChild.remove();
                this.els.statusLog.scrollTop = this.els.statusLog.scrollHeight;
            }
        }

        // ---- Login & app bootstrap ----
        const broadcaster = new DJBroadcaster();

        const loginForm = document.getElementById('login-form');
        const loginNameInput = document.getElementById('login-name');
        const loginPassInput = document.getElementById('login-password');
        const loginGate = document.getElementById('login-gate');
        const dashboard = document.getElementById('dashboard');
        const btnLogout = document.getElementById('btn-logout');

        function enterDashboard(djName, token) {
            loginGate.style.display = 'none';
            dashboard.style.display = 'flex';
            broadcaster.init(djName, token);
        }

        const storedDJ = sessionStorage.getItem('wave_dj_name');
        const storedToken = sessionStorage.getItem('wave_dj_token');
        if (storedDJ && storedToken) enterDashboard(storedDJ, storedToken);

        // The password is verified by the relay server (DJ_PASSWORD env var),
        // so changing it on the server works without editing this page.
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const djName = loginNameInput.value.trim() || 'DJ';
            const pass = loginPassInput.value;
            if (!pass) return;
            sessionStorage.setItem('wave_dj_name', djName);
            sessionStorage.setItem('wave_dj_token', pass);
            enterDashboard(djName, pass);
        });

        btnLogout.addEventListener('click', () => {
            if (broadcaster.isLive && !confirm('You are currently live! Stop broadcasting and log out?')) return;
            broadcaster.disconnect();
            sessionStorage.removeItem('wave_dj_name');
            sessionStorage.removeItem('wave_dj_token');
            dashboard.style.display = 'none';
            loginGate.style.display = 'flex';
            loginPassInput.value = '';
        });
    </script>
</body>
</html>
